<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a14" />
      <stop offset="1" stop-color="#0e0820" />
    </linearGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.55" />
      <stop offset="1" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-magenta" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.45" />
      <stop offset="1" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bar-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" />
      <stop offset="0.5" stop-color="#d946ef" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="package-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- Atmospheric glows -->
  <circle cx="200" cy="120" r="380" fill="url(#glow-purple)" />
  <circle cx="1080" cy="540" r="420" fill="url(#glow-cyan)" />
  <circle cx="700" cy="320" r="320" fill="url(#glow-magenta)" />

  <!-- Faint grid texture (subtle structure) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
  </g>

  <!-- Safe area content begins (80px inset = 40pt) -->

  <!-- Evolonix three-bar wordmark — square 200×200, matches logo.svg proportions (viewBox 64×64) -->
  <g transform="translate(540, 130)">
    <rect x="0" y="0" width="200" height="38.75" rx="19.375" fill="#a855f7" />
    <rect x="0" y="80.625" width="137.5" height="38.75" rx="19.375" fill="#d946ef" />
    <rect x="0" y="161.25" width="200" height="38.75" rx="19.375" fill="#22d3ee" />
  </g>

  <!-- Package name -->
  <text x="640" y="412" text-anchor="middle"
    font-family="Manrope, ManropeExtraLight, 'SF Pro Display', Helvetica, Arial, sans-serif" font-weight="800"
    font-size="78" letter-spacing="-2" fill="#ffffff">@evolonix/react-router-next</text>

  <!-- Accent rule — spans the rendered width of the package name -->
  <rect x="102" y="444" width="1076" height="4" rx="2" fill="#ffffff" />

  <!-- Tagline -->
  <text x="640" y="514" text-anchor="middle" font-family="Manrope, 'SF Pro Display', Helvetica, Arial, sans-serif"
    font-weight="500" font-size="32" letter-spacing="0" fill="#cbd5e1">Next.js-style filesystem routing for React Router
    7</text>
</svg>