name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  deploy-demo:
    needs: checks
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        !startsWith(github.event.head_commit.message, 'chore(release):')
      }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/demo/dist
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: checks
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Get next version
        id: next_version
        run: |
          npx changeset status --output=release.json
          VERSION=$(node -p "const r = require('./release.json').releases.find(r => r.name === '@evolonix/react-router-next' && r.type !== 'none'); r?.newVersion ?? ''")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          rm -f release.json
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release # release runs build
          commit: "chore(release): version packages${{ steps.next_version.outputs.version && format(' {0}', steps.next_version.outputs.version) || '' }}"
          title: "chore(release): version packages${{ steps.next_version.outputs.version && format(' {0}', steps.next_version.outputs.version) || '' }}"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
