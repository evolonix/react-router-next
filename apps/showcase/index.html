    <title>
      @evolonix/react-router-next — Filesystem routing for React Router 7
    </title>
    <meta
      name="description"
      content="Next.js-style filesystem routing for React Router 7. Drop a page.tsx into a folder, get a typed route — including nested layouts, parallel routes, intercepting routes, and more."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("evolonix-theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {}
      })();

      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // MIT License
      // Decodes the ?/path redirect written by 404.html so React Router
      // sees the original URL before any route matching happens.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
