<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>React Router Next Demo</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // MIT License
      //
      // GitHub Pages serves a single 404.html from the published root for the
      // entire project site, so this file handles 404s for both the landing
      // demo (served at /<repo>/) and the three bundler showcases (served at
      // /<repo>/{vite,rsbuild,webpack}/). The number of leading path segments
      // to preserve depends on which app the missing URL belongs to.
      var BUNDLERS = ["vite", "rsbuild", "webpack"];

      var l = window.location;
      var segments = l.pathname.split("/").filter(Boolean);
      // segments[0] is the repo name; segments[1] tells us whether we're
      // inside a bundler subapp (keep 2) or the landing demo (keep 1).
      var pathSegmentsToKeep =
        segments[1] && BUNDLERS.indexOf(segments[1]) !== -1 ? 2 : 1;

      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
